# NGAP - the control conversation between a 5G radio site and the core network.
#
# `name` is generated from the Wireshark dissector by scripts/sync_codes.py.
# `plain` is written by hand (or by the pcap-learn skill) and is the only
# thing the report is allowed to say about a procedure. null = not yet known.
