# F1AP - the control conversation between the two halves of a split base
# station: the radio unit (DU) and the central unit (CU).
protocol: f1ap
name: F1 Application Protocol
plain_name: the conversation between the antenna side and the brain of a base station
transport: SCTP port 38472
code_field: f1ap.procedureCode
spec: 3GPP TS 38.473
codes:
  0:
    name: "id-Reset"
    plain: "One side cleared out its records and asked the other to do the same."
    reply: expected
  1:
    name: "id-F1Setup"
    plain: "The antenna side introduced itself to the base station's brain and asked to join it."
    reply: expected
  2:
    name: "id-ErrorIndication"
    plain: "One side reported that it could not make sense of a message it received."
    reply: none
  3:
    name: "id-gNBDUConfigurationUpdate"
    plain: "The antenna side reported a change to its cells or configuration."
    reply: expected
  4:
    name: "id-gNBCUConfigurationUpdate"
    plain: "The brain of the base station reported a change to its own configuration."
    reply: expected
  5:
    name: "id-UEContextSetup"
    plain: "The brain asked the antenna side to set up the radio link for a phone."
    reply: expected
  6:
    name: "id-UEContextRelease"
    plain: "A phone's radio resources were released at the antenna side."
    reply: expected
  7:
    name: "id-UEContextModification"
    plain: "The brain asked the antenna side to change a phone's radio setup."
    reply: expected
  8:
    name: "id-UEContextModificationRequired"
    plain: "The antenna side reported that a phone's radio setup had to change."
    reply: expected
  9:
    name: "id-UEMobilityCommand"
    plain: null
  10:
    name: "id-UEContextReleaseRequest"
    plain: "The antenna side asked to let go of a phone."
    reply: none
  11:
    name: "id-InitialULRRCMessageTransfer"
    plain: "A phone made first contact with the antenna side, which passed it to the brain."
    reply: none
  12:
    name: "id-DLRRCMessageTransfer"
    plain: "The brain sent a radio-control message down to a phone."
    reply: none
  13:
    name: "id-ULRRCMessageTransfer"
    plain: "A phone sent a radio-control message up to the brain."
    reply: none
  14:
    name: "id-privateMessage"
    plain: null
  15:
    name: "id-UEInactivityNotification"
    plain: "The antenna side reported that a phone has gone quiet."
    reply: none
  16:
    name: "id-GNBDUResourceCoordination"
    plain: null
  17:
    name: "id-SystemInformationDeliveryCommand"
    plain: null
  18:
    name: "id-Paging"
    plain: "The base station was asked to call out for a phone."
    reply: none
  19:
    name: "id-Notify"
    plain: null
  20:
    name: "id-WriteReplaceWarning"
    plain: null
  21:
    name: "id-PWSCancel"
    plain: null
  22:
    name: "id-PWSRestartIndication"
    plain: null
  23:
    name: "id-PWSFailureIndication"
    plain: null
  24:
    name: "id-GNBDUStatusIndication"
    plain: "The antenna side reported a change in its own status."
    reply: none
  25:
    name: "id-RRCDeliveryReport"
    plain: "The antenna side confirmed that a radio-control message reached the phone."
    reply: none
  26:
    name: "id-F1Removal"
    plain: "One half of the base station asked to disconnect from the other."
    reply: expected
