# The older flat format: one address carrying its own name.
#
# Kept for two reasons. It is the fallback when no lab has been chosen, and it
# is what the tests render against - the numbering below is invented, so the
# golden reports in tests/expected/ can be committed safely.
#
# For real work prefer the split form, which shares the descriptions between
# labs and keeps the addresses out of the repository:
#
#   knowledge/topology.yaml            the equipment and its names (committed)
#   labs/<lab>.yaml                    address -> equipment      (never committed)
#
# See knowledge/addresses.example.yaml and labs/README.md. This format cannot
# be shared between labs, which is the whole reason the split exists.
#
#   name  - what to call it in the report, in plain words
#   role  - one of: radio, core, forwarder, subscriber, other
#   note  - optional, one line of context for the reader
nodes:
  10.10.1.10:
    name: "Base station brain (site A)"
    role: radio
    note: "Central unit of the split base station at site A"
  10.10.1.11:
    name: "Base station antenna side (site A)"
    role: radio
    note: "Distributed unit of the split base station at site A"
  10.10.2.20:
    name: "Core network access manager"
    role: core
    note: "Handles phones joining the network and staying reachable"
  10.10.2.21:
    name: "Core network session manager"
    role: core
    note: "Decides the rules for each subscriber's data connection"
  10.10.2.30:
    name: "Traffic forwarder"
    role: forwarder
    note: "Carries subscriber data between the base stations and the internet"
